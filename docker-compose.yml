version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: streampulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-streampulse}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./sql/01_staging.sql:/docker-entrypoint-initdb.d/01_staging.sql:ro
      - ./sql/02_reporting.sql:/docker-entrypoint-initdb.d/02_reporting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-streampulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streampulse_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streampulse_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streampulse.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - streampulse_network

networks:
  streampulse_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
