name: StreamPulse 2026 Scheduled Ingestion Pipeline

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: streampulse-scheduled-ingestion
  cancel-in-progress: false

jobs:
  run-live-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Check live database configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: 5432
          DB_SSLMODE: require
        shell: bash
        run: |
          for name in DB_HOST DB_USER DB_PASSWORD DB_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Live ingestion configuration missing::Set GitHub Actions secret $name for scheduled warehouse ingestion."
              exit 1
            fi
          done
          if [[ "$DB_HOST" == "localhost" || "$DB_HOST" == "127.0.0.1" ]]; then
            echo "::error title=Inaccessible host::The GitHub-hosted runner cannot reach your laptop's localhost database. Use an approved network-reachable endpoint or a self-hosted runner."
            exit 1
          fi

      - name: Bootstrap and verify PostgreSQL warehouse
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: 5432
          DB_SSLMODE: require
        run: |
          python - <<'PY'
          from pathlib import Path
          from sqlalchemy import text
          from src.utils.db import db_manager

          scripts = (
              "sql/00_init.sql",
              "sql/01_staging.sql",
              "sql/02_reporting.sql",
          )
          required_relations = (
              "staging.stg_netflix_titles",
              "reporting.dim_date",
              "reporting.dim_titles",
              "reporting.dim_genres",
              "reporting.dim_talent_crew",
              "reporting.bridge_title_genre",
              "reporting.bridge_title_talent",
              "reporting.fact_catalog_ratings",
              "reporting.fact_streaming_performance",
              "reporting.fact_financial_roi",
              "reporting.vw_powerbi_catalog_pulse",
          )

          with db_manager.connect() as connection:
              for script in scripts:
                  print(f"Applying {script}")
                  connection.exec_driver_sql(Path(script).read_text(encoding="utf-8"))

              missing = [
                  relation
                  for relation in required_relations
                  if connection.execute(
                      text("SELECT to_regclass(:relation)"),
                      {"relation": relation},
                  ).scalar_one() is None
              ]
              if missing:
                  raise RuntimeError(
                      "Warehouse bootstrap is incomplete: " + ", ".join(missing)
                  )

              identity = connection.execute(
                  text("SELECT current_database(), current_user")
              ).one()
              # Inspect the client-side libpq socket. pg_stat_ssl reports the
              # PostgreSQL backend connection, which can be different when a
              # provider routes clients through a connection pooler (for example,
              # Neon PgBouncer).
              dbapi_connection = connection.connection.driver_connection
              ssl_enabled = dbapi_connection.info.ssl_in_use
              if not ssl_enabled:
                  raise RuntimeError(
                      "PostgreSQL client connection is not using TLS "
                      "(psycopg2 ssl_in_use=False)."
                  )

          print(
              f"PostgreSQL ready: database={identity[0]}, role={identity[1]}, "
              f"TLS=enabled, required_relations={len(required_relations)}"
          )
          PY

      - name: Execute Live 2026 ELT Pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: 5432
          DB_SSLMODE: require
        run: |
          python -m src.pipeline --mode live --years 2026,2025 --limit 100 --require-database

      - name: Archive Processed Data Artifacts & Profiling Reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streampulse-2026-data-artifacts
          path: |
            data/processed/netflix_catalog_enriched_master.csv
            data/processed/live_2026_pulse.json
            data/processed/data_profiling_report.json
          if-no-files-found: error
          retention-days: 14
