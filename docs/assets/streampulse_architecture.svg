      <text x="50" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">MEDALLION</text>
      
      <rect x="110" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="170" y="17" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">KIMBALL GALAXY</text>

