<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
