      <text x="14" y="44" fill="#94a3b8" font-size="10">• Periodic IMDb User Scores</text>
      <text x="14" y="60" fill="#94a3b8" font-size="10">• Vote Multipliers (M / K)</text>
      <text x="14" y="76" fill="#94a3b8" font-size="10">• Critic Metascores &amp; Sentiment</text>
