    <path d="M 14,23 L 20,23 L 24,12 L 28,34 L 32,23 L 36,23" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="60" y="26" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="1">STREAMPULSE 2026 ENTERPRISE ARCHITECTURE</text>
    <text x="60" y="44" fill="#94a3b8" font-size="12" font-weight="600">MEDALLION LAKEHOUSE, KIMBALL GALAXY MODEL &amp; POWER BI NATIVE NETFLIX WEB-APP</text>

    <!-- Badges -->
